server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /panorama/;
    }

    location = /panorama {
        return 301 /panorama/;
    }

    # SPA 路由回退到 /panorama/index.html
    location /panorama/ {
        try_files $uri $uri/ /panorama/index.html;
    }

    # 构建产物静态资源缓存（Vite base 为 /panorama/ 时生效）
    location ~* ^/panorama/assets/.*\.(?:js|mjs|css|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm|glb|gltf|bin|hdr|exr)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /panorama/index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
}
