# WebSocket upgrade 映射（本文件被 include 在 nginx 的 http 上下文中）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 用变量 + Docker DNS 延迟解析上游，避免 panorama/api 尚未就绪时 Nginx 启动失败
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:7000;
    set $panorama_upstream http://panorama:80;

    # 全景图分片上传等大请求
    client_max_body_size 200m;

    # 静态资源缓存。使用 ^~ 前缀的 /api/、/panorama/ 不会落入此正则
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm|glb|gltf|bin|hdr|exr)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 全景 SPA：proxy_pass 不带 URI，完整保留 /panorama/ 前缀
    location ^~ /panorama/ {
        proxy_pass $panorama_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /panorama {
        return 301 /panorama/;
    }

    # 后台入口跳转到全景前端的 admin 路由
    location = /admin {
        return 302 /panorama/admin;
    }

    location ^~ /admin/ {
        return 302 /panorama$request_uri;
    }

    # API：proxy_pass 不带 URI，完整保留 /api/v1 前缀
    location ^~ /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / 长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 分片上传直接透传
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 仿真 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
}
